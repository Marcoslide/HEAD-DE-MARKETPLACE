<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head Marketplace OS — v8</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">H</div>
      <div class="brand-t"><b>Head Marketplace</b><span>Operating System</span></div>
      <button class="side-fold" id="sideFold" title="Recolher menu" aria-label="Recolher menu">⟨</button>
    </div>

    <!-- 10.P.3 — navegação principal reduzida a 6 áreas. Os módulos existentes
         não foram removidos: cada área agrupa as views antigas por uma sub-navegação
         contextual (ver UI.AREAS em app.js). Sem duplicar dados. -->
    <nav class="nav" id="nav" aria-label="Navegação principal">
      <button data-area="inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Início</span><em class="nbadge" data-badge="inicio"></em></button>
      <button data-area="catalogo"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Catálogo</span><em class="nbadge" data-badge="catalogo"></em></button>
      <button data-area="crescimento"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Crescimento</span><em class="nbadge" data-badge="crescimento"></em></button>
      <button data-area="operacao"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg><span>Operação</span><em class="nbadge" data-badge="operacao"></em></button>
      <button data-area="execucao"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg><span>Execução</span><em class="nbadge" data-badge="execucao"></em></button>
      <button data-area="config"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg><span>Configurações</span><em class="nbadge" data-badge="config"></em></button>
    </nav>

    <div class="side-foot">
      <div class="user"><div class="avatar">M</div><div class="user-t"><b>Marcos</b><span>ADMIN</span></div></div>
      <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <span class="tt-sun">☀</span><span class="tt-moon">☾</span><span class="tt-label" id="themeLabel">Escuro</span>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main" id="main">
    <!-- BARRA GLOBAL OPERACIONAL: contexto de empresa, marketplace, período,
         ambiente, busca, notificações e jobs — muda o contexto das telas -->
    <header class="topbar" id="gbar">
      <div class="crumb" id="crumb">Home</div>
      <span class="gsep"></span>
      <div id="gbarCtx" style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;flex:1"></div>
      <div class="topbar-right" id="gbarRight">
        <span id="gbarTools" style="display:contents"></span>
        <span class="chip chip-demo" title="Todos os dados desta instância são demonstrativos e rotulados. Nenhuma conta foi conectada; nenhuma ação externa foi executada.">DADO SIMULADO · rotulado</span>
        <span class="chip chip-lock" title="READ_ONLY é o padrão do sistema. Publicação externa exige conexão oficial, regra confirmada e aprovação.">ESCRITA EXTERNA BLOQUEADA</span>
      </div>
    </header>

    <!-- 10.P.3 — sub-navegação contextual da área ativa (regrupa as views antigas) -->
    <nav class="subnav" id="subnav" aria-label="Sub-navegação da área"></nav>

    <section class="view on" id="v-home"></section>
    <section class="view" id="v-operacao"></section>
    <section class="view" id="v-pedidos"></section>
    <section class="view" id="v-conciliacao"></section>
    <section class="view" id="v-catalogo"></section>
    <section class="view" id="v-crescimento"></section>
    <section class="view" id="v-seo"></section>
    <section class="view" id="v-custos"></section>
    <section class="view" id="v-empresas"></section>
    <section class="view" id="v-conexoes"></section>
    <section class="view" id="v-missao"></section>
    <section class="view" id="v-silencio"></section>
    <section class="view" id="v-conhecimento"></section>
    <section class="view" id="v-importar"></section>
    <section class="view" id="v-ativacao"></section>
    <section class="view" id="v-equipe"></section>
    <section class="view" id="v-planos"></section>
    <section class="view" id="v-suporte"></section>
  </main>
</div>

<!-- GATE COMERCIAL (10.V): landing → auth → onboarding → produto -->
<div class="gate" id="gate" hidden></div>

<!-- drawer + modal + toast -->
<div class="drawer-wrap" id="drawerWrap" hidden>
  <div class="drawer-scrim" onclick="UI.closeDrawer()"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
</div>
<div class="modal-wrap" id="modalWrap" hidden>
  <div class="drawer-scrim" onclick="UI.closeModal()"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- Camada COMPARTILHADA real (mesma dos testes Node) -->

<script src="data.js"></script>

<script src="catalogo.js"></script>

</html>
