<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head Marketplace OS — v8</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">H</div>
      <div class="brand-t"><b>Head Marketplace</b><span>Operating System</span></div>
      <button class="side-fold" id="sideFold" title="Recolher menu" aria-label="Recolher menu">⟨</button>
    </div>

    <nav class="nav" id="nav" aria-label="Navegação principal">
      <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Home</span><em class="nbadge" data-badge="home"></em></button>
      <button data-v="operacao"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg><span>Operação</span><em class="nbadge" data-badge="operacao"></em></button>
      <button data-v="catalogo"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Catálogo</span><em class="nbadge" data-badge="catalogo"></em></button>
      <button data-v="crescimento"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Crescimento</span><em class="nbadge" data-badge="crescimento"></em></button>
      <button data-v="conexoes"><svg viewBox="0 0 24 24"><path d="M9 12a4 4 0 0 1 4-4h4a4 4 0 0 1 0 8h-2M15 12a4 4 0 0 1-4 4H7a4 4 0 0 1 0-8h2"/></svg><span>Conexões</span><em class="nbadge" data-badge="conexoes"></em></button>
      <button data-v="missao"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>A Missão</span><em class="nbadge" data-badge="missao"></em></button>
      <button data-v="silencio"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></svg><span>Silêncio</span><em class="nbadge" data-badge="silencio"></em></button>
      <button data-v="conhecimento"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2zM19 3v18M8 7h7M8 11h7"/></svg><span>Conhecimento</span><em class="nbadge" data-badge="conhecimento"></em></button>
    </nav>

    <div class="side-foot">
      <div class="user"><div class="avatar">M</div><div class="user-t"><b>Marcos</b><span>ADMIN</span></div></div>
      <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <span class="tt-sun">☀</span><span class="tt-moon">☾</span><span class="tt-label" id="themeLabel">Escuro</span>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main" id="main">
    <!-- BARRA GLOBAL OPERACIONAL: contexto de empresa, marketplace, período,
         ambiente, busca, notificações e jobs — muda o contexto das telas -->
    <header class="topbar" id="gbar">
      <div class="crumb" id="crumb">Home</div>
      <span class="gsep"></span>
      <div id="gbarCtx" style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;flex:1"></div>
      <div class="topbar-right" id="gbarRight">
        <span id="gbarTools" style="display:contents"></span>
        <span class="chip chip-demo" title="Todos os dados desta instância são demonstrativos e rotulados. Nenhuma conta foi conectada; nenhuma ação externa foi executada.">DADO SIMULADO · rotulado</span>
        <span class="chip chip-lock" title="READ_ONLY é o padrão do sistema. Publicação externa exige conexão oficial, regra confirmada e aprovação.">ESCRITA EXTERNA BLOQUEADA</span>
      </div>
    </header>

    <section class="view on" id="v-home"></section>
    <section class="view" id="v-operacao"></section>
    <section class="view" id="v-catalogo"></section>
    <section class="view" id="v-crescimento"></section>
    <section class="view" id="v-conexoes"></section>
    <section class="view" id="v-missao"></section>
    <section class="view" id="v-silencio"></section>
    <section class="view" id="v-conhecimento"></section>
  </main>
</div>

<!-- drawer + modal + toast -->
<div class="drawer-wrap" id="drawerWrap" hidden>
  <div class="drawer-scrim" onclick="UI.closeDrawer()"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
</div>
<div class="modal-wrap" id="modalWrap" hidden>
  <div class="drawer-scrim" onclick="UI.closeModal()"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<!-- Camada COMPARTILHADA real (mesma dos testes Node) -->
<script src="../../mie/src/core/clock.js"></script>
<script src="../../mos/src/chat/interpreter.js"></script>
<script src="../../mos/src/chat/period.js"></script>
<script src="../../mos/src/chat/demo-dataset.js"></script>
<script src="../../mos/src/chat/query-layer.js"></script>
<script src="../../mos/src/chat/composer.js"></script>
<script src="../../mos/src/chat/head-chat.js"></script>
<script src="../../mos/src/compliance/rule-packs.js"></script>
<script src="../../mos/src/compliance/engine.js"></script>
<script src="../../mos/src/compliance/demo-products.js"></script>
<script src="../../mos/src/compliance/chat-adapter.js"></script>
<script src="../../mos/src/growth/demo-growth.js"></script>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="home.js"></script>
<script src="operacao.js"></script>
<script src="catalogo.js"></script>
<script src="crescimento.js"></script>
<script src="conexoes.js"></script>
<script src="missao.js"></script>
<script src="silencio.js"></script>
<script src="conhecimento.js"></script>
</body>
</html>
