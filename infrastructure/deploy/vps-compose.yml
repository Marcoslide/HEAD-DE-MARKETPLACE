# STAGING PUBLICADO em um VPS (20 min): Postgres+Redis persistentes,
# api+worker contínuos, Caddy com TLS automático no seu domínio.
#   1) DNS: staging.SEU-DOMINIO.com -> IP do VPS
#   2) cp staging.env.example staging.env  (preencha HEAD_SECRET_STAGING)
#   3) docker compose -f vps-compose.yml --env-file staging.env up -d
#   4) npm run smoke:staging (no VPS)  ·  curl https://staging.SEU-DOMINIO.com/health
services:
  postgres:
    image: postgres:16
    environment: [POSTGRES_DB=head_staging, POSTGRES_HOST_AUTH_METHOD=trust]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  api:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.api }
    environment:
      - HEAD_ENV=STAGING
      - HEAD_SECRET_STAGING=${HEAD_SECRET_STAGING}
      - DATABASE_URL=postgres://postgres@postgres:5432/head_staging
      - REDIS_URL=redis://redis:6379
    volumes: [headdata:/data]
    depends_on: [postgres, redis]
    restart: unless-stopped
  worker:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.worker }
    environment:
      - HEAD_ENV=STAGING
      - HEAD_SECRET_STAGING=${HEAD_SECRET_STAGING}
      - DATABASE_URL=postgres://postgres@postgres:5432/head_staging
      - REDIS_URL=redis://redis:6379
    volumes: [headdata:/data]
    depends_on: [postgres, redis]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    command: ["caddy", "reverse-proxy", "--from", "${STAGING_DOMAIN:-staging.example.com}", "--to", "api:3080"]
    restart: unless-stopped
volumes: { pgdata: {}, redisdata: {}, headdata: {} }
